<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-label="示例占位图">
  <!--
    脚手架自带的占位图（自绘）。
    它只是"还没找到图"时的过渡：内容位（商品 / 人物 / 封面 / 游戏截图）上线前要换成**真实素材**
    （官方公开图 / 图库实图等，没有明确禁止免费使用就能用；下载到 src/assets/ 并登记来源），
    口径见 ui-design-skill 的 02 §8 与 01 §11。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25324a" />
      <stop offset="1" stop-color="#0f1726" />
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="22%" r="62%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".55" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hill-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3a55" />
      <stop offset="1" stop-color="#141c2c" />
    </linearGradient>
    <linearGradient id="hill-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4a67" />
      <stop offset="1" stop-color="#1b2436" />
    </linearGradient>
  </defs>

  <rect width="640" height="640" fill="url(#bg)" />
  <rect width="640" height="640" fill="url(#glow)" />
  <circle cx="452" cy="168" r="66" fill="#a5b4fc" opacity=".85" />

  <path d="M0 430C120 380 220 452 320 424s200-94 320-52v268H0z" fill="url(#hill-back)" />
  <path d="M0 502c140-48 240 26 360-2s200-68 280-46v186H0z" fill="url(#hill-front)" />

  <g fill="#94a3b8" opacity=".55">
    <circle cx="88" cy="98" r="3" />
    <circle cx="132" cy="70" r="2" />
    <circle cx="172" cy="112" r="2" />
    <circle cx="520" cy="88" r="2" />
    <circle cx="566" cy="126" r="3" />
  </g>
</svg>
